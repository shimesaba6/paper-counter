<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>来客数カウンター</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f0f4f8;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    header {
      background: #34495e; color: white;
      padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    h1 { margin: 0; font-size: 24px; }
    .gear-btn {
      background: none; border: none; color: white;
      font-size: 28px; cursor: pointer;
    }
    .main-content {
      flex: 1; display: flex; flex-direction: column;
      padding: 15px; gap: 15px;
    }
    .top-section {
      display: flex; justify-content: center; align-items: center;
      gap: 40px; padding: 10px;
    }
    .total-display {
      font-size: 32px; font-weight: bold; color: #333;
      text-align: center; position: relative;
    }
    .total-count { font-size: 80px; color: #e74c3c; line-height: 1; }
    
    /* 取り消しボタン */
    .undo-btn {
      background: #7f8c8d; color: white; border: none;
      padding: 8px 15px; border-radius: 8px; font-size: 16px;
      cursor: pointer; margin-top: 5px; box-shadow: 0 3px 0 #576574;
    }
    .undo-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #576574; }

    /* メインボタン */
    .count-btn {
      font-size: 48px; font-weight: bold;
      padding: 30px 60px;
      background: #3498db; color: white;
      border: none; border-radius: 20px;
      box-shadow: 0 8px 0 #2980b9; cursor: pointer;
      transition: all 0.1s;
      width: 380px; /* 文字が変わっても幅を固定 */
    }
    .count-btn:active:not(.cooldown) {
      transform: translateY(8px); box-shadow: 0 0 0 #2980b9;
    }
    /* クールダウン（連打防止）中の見た目 */
    .count-btn.cooldown {
      background: #bdc3c7;
      box-shadow: 0 8px 0 #95a5a6;
      cursor: not-allowed;
    }

    .charts-section {
      flex: 1; display: flex; gap: 20px; min-height: 0;
    }
    .chart-container {
      background: white; border-radius: 15px;
      padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      flex: 1; display: flex; flex-direction: column;
    }
    .chart-container h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; color: #555; }
    .canvas-wrapper { flex: 1; position: relative; }
    
    /* モーダル設定画面 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 30px; border-radius: 15px;
      width: 320px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
    .modal-btns { display: flex; justify-content: space-between; margin-top: 20px; }
    .modal-btns button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
    .save-btn { background: #2ecc71; color: white; }
    .close-btn { background: #95a5a6; color: white; }
    .reset-btn { background: #e74c3c; color: white; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>来客数カウンター</h1>
    <button class="gear-btn" onclick="openModal()">⚙️</button>
  </header>

  <div class="main-content">
    <div class="top-section">
      <div class="total-display">
        合計<br><span id="total-text" class="total-count">0</span> 人<br>
        <button class="undo-btn" onclick="undoCount()">↩ 1つ減らす</button>
      </div>
      <button class="count-btn" id="main-count-btn">＋ カウント</button>
    </div>

    <div class="charts-section">
      <div class="chart-container" style="flex: 2;">
        <h2>時間帯別グラフ (人)</h2>
        <div class="canvas-wrapper"><canvas id="barChart"></canvas></div>
      </div>
      <div class="chart-container" style="flex: 1;">
        <h2>割合</h2>
        <div class="canvas-wrapper"><canvas id="pieChart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h2 style="margin-top:0;">設定</h2>
      <div class="form-group">
        <label>開始時間</label>
        <input type="time" id="input-start">
      </div>
      <div class="form-group">
        <label>終了時間</label>
        <input type="time" id="input-end">
      </div>
      <div class="form-group">
        <label>区切り（分）</label>
        <input type="number" id="input-interval" min="5" max="60" step="5">
      </div>
      <div class="form-group">
        <label>連打防止ロック時間（秒）</label>
        <input type="number" id="input-cooldown" min="0" max="10" step="0.5">
      </div>
      <div class="modal-btns">
        <button class="close-btn" onclick="closeModal()">キャンセル</button>
        <button class="save-btn" onclick="saveConfig()">保存</button>
      </div>
      <hr style="margin: 20px 0;">
      <button class="reset-btn" onclick="resetData()">データをすべてリセット</button>
    </div>
  </div>

  <script>
    // 状態管理
    let records = JSON.parse(localStorage.getItem('visitorRecords')) || [];
    let config = JSON.parse(localStorage.getItem('visitorConfig')) || {
      start: '10:00', end: '12:00', interval: 15, cooldown: 2.0
    };
    let isCooldown = false;
    let barChart, pieChart;

    // グラフの初期化
    function initCharts() {
      Chart.defaults.font.size = 14;
      const barCtx = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(barCtx, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: '来客数', data: [], backgroundColor: '#3498db' }] },
        options: { responsive: true, maintainAspectRatio: false,
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
          plugins: { legend: { display: false } }
        }
      });

      const pieCtx = document.getElementById('pieChart').getContext('2d');
      pieChart = new Chart(pieCtx, {
        type: 'pie',
        data: { labels: [], datasets: [{ data: [], backgroundColor: [
          '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#E7E9ED', '#8E44AD', '#2ECC71'
        ]}] },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'right' } }
        }
      });
    }

    // データの集計と描画更新
    function updateDashboard() {
      document.getElementById('total-text').innerText = records.length;

      const now = new Date();
      const startParts = config.start.split(':');
      const endParts = config.end.split(':');
      const startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), startParts[0], startParts[1]).getTime();
      const endTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), endParts[0], endParts[1]).getTime();
      const intervalMs = config.interval * 60 * 1000;

      let labels = [];
      let counts = [];

      for (let t = startTime; t < endTime; t += intervalMs) {
        let d1 = new Date(t);
        let label = `${d1.getHours()}:${String(d1.getMinutes()).padStart(2, '0')}`;
        labels.push(label);
        counts.push(0);
      }

      records.forEach(timestamp => {
        if (timestamp >= startTime && timestamp < endTime) {
          let index = Math.floor((timestamp - startTime) / intervalMs);
          if (index >= 0 && index < counts.length) {
            counts[index]++;
          }
        }
      });

      barChart.data.labels = labels;
      barChart.data.datasets[0].data = counts;
      barChart.update();

      pieChart.data.labels = labels;
      pieChart.data.datasets[0].data = counts;
      pieChart.update();
    }

    // カウント追加処理（連打防止機能付き）
    function addCount() {
      if (isCooldown) return; // ロック中は無視する

      records.push(Date.now());
      localStorage.setItem('visitorRecords', JSON.stringify(records));
      updateDashboard();
      
      const btn = document.getElementById('main-count-btn');
      
      // クールダウン処理を開始
      if (config.cooldown > 0) {
        isCooldown = true;
        btn.classList.add('cooldown');
        btn.innerText = '待ってね...';
        
        setTimeout(() => {
          isCooldown = false;
          btn.classList.remove('cooldown');
          btn.innerText = '＋ カウント';
        }, config.cooldown * 1000);
      } else {
        // ロック0秒の場合はクリックエフェクトのみ
        btn.style.transform = 'translateY(8px)';
        btn.style.boxShadow = '0 0 0 #2980b9';
        setTimeout(() => {
          btn.style.transform = '';
          btn.style.boxShadow = '';
        }, 100);
      }
    }

    // カウント取り消し処理
    function undoCount() {
      if (records.length > 0) {
        records.pop(); // 最後の1件を削除
        localStorage.setItem('visitorRecords', JSON.stringify(records));
        updateDashboard();
      }
    }

    // イベントリスナーの設定
    document.getElementById('main-count-btn').addEventListener('click', addCount);
    
    // 外部スイッチ（スペースキー・エンターキー）への対応
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        if (document.activeElement === document.getElementById('main-count-btn')) return;
        e.preventDefault();
        addCount();
      }
    });

    // モーダル関連処理
    function openModal() {
      document.getElementById('input-start').value = config.start;
      document.getElementById('input-end').value = config.end;
      document.getElementById('input-interval').value = config.interval;
      document.getElementById('input-cooldown').value = config.cooldown;
      document.getElementById('settings-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('settings-modal').style.display = 'none'; }
    function saveConfig() {
      config.start = document.getElementById('input-start').value || '10:00';
      config.end = document.getElementById('input-end').value || '12:00';
      config.interval = parseInt(document.getElementById('input-interval').value) || 15;
      config.cooldown = parseFloat(document.getElementById('input-cooldown').value) || 0;
      localStorage.setItem('visitorConfig', JSON.stringify(config));
      closeModal();
      updateDashboard();
    }
    function resetData() {
      if (confirm('記録されたすべてのカウントデータを削除しますか？\n（この操作は元に戻せません）')) {
        records = [];
        localStorage.removeItem('visitorRecords');
        closeModal();
        updateDashboard();
      }
    }

    // 起動時の処理
    window.onload = () => {
      initCharts();
      updateDashboard();
    };
  </script>
</body>
</html>
